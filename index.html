<script>
// Use the user's supplied symbols as the two playback states without changing the control's position.
const transportButton=document.querySelector('#play-btn');
function paintTransportState(){
  if(!transportButton)return;
  const isPlaying=!document.querySelector('#audio-player').paused;
  transportButton.innerHTML=`<span class="transport-art ${isPlaying?'playing':'paused'}" aria-hidden="true"></span>`;
  transportButton.setAttribute('aria-label',isPlaying?'pause':'play');
}
['play','pause','ended','loadedmetadata'].forEach(ev=>document.querySelector('#audio-player').addEventListener(ev,paintTransportState));
paintTransportState();

// Keep short titles still and centered; only scroll when the full name cannot fit.
function fitTrackTitle(){
  const host=document.querySelector('#music-track');
  if(!host)return;
  const current=host.querySelector('.track-runner span')?.textContent || host.textContent.trim();
  host.classList.remove('is-overflowing');
  host.innerHTML='';
  const runner=document.createElement('div');runner.className='track-runner';
  const first=document.createElement('span');first.textContent=current;runner.append(first);host.append(runner);
  requestAnimationFrame(()=>{
    if(first.scrollWidth>host.clientWidth-20){
      const second=document.createElement('span');second.textContent=current;runner.append(second);host.classList.add('is-overflowing');
    }
  });
}
const previousQueueLoad=loadQueueTrack;
loadQueueTrack=function(index,autoplay=true){previousQueueLoad(index,autoplay);fitTrackTitle();paintTransportState();};
const trackObserver=new ResizeObserver(fitTrackTitle);trackObserver.observe(document.querySelector('#music-track'));
window.addEventListener('resize',fitTrackTitle);fitTrackTitle();

// Pencil edits only the profile picture. The thought bubble edits itself when clicked.
editProfile=function(){
  openModal('change profile picture',[{name:'avatar',label:'Choose a profile image',type:'file',accept:'image/*',required:true}],async d=>{
    if(!d.avatar||!d.avatar.type.startsWith('image/')){toast('choose an image');return}
    if(d.avatar.size>16777216){toast('choose an image smaller than 16 MB');return}
    const data=await fileToData(d.avatar);
    cropEditor(data,db.profileCrop||{},crop=>{db.profile.avatar=data;db.profileCrop=crop;persist();renderProfile();cropStyle(document.querySelector('#profile-image'),crop);toast('profile picture updated')});
  });
};
document.querySelector('#thought').addEventListener('click',()=>{
  openModal('edit thought bubble',[{name:'thought',label:'Thought / status',type:'textarea',value:db.profile.thought||''}],d=>{db.profile.thought=d.thought||'';persist();renderProfile();toast('thought bubble updated')});
});
// Keep the avatar image itself non-interactive so only the pencil opens its editor.
document.querySelector('#profile-image').style.cursor='default';
document.querySelector('#profile-image').onclick=null;
document.querySelector('#profile-image').addEventListener('click',e=>{e.stopImmediatePropagation();},true);
</script>

<script id="photo-actions-v12">
// Rounded one-click action popovers for camera photos and album artwork.
(function(){
  let pendingPaste=null;
  const imageFile=async file=>{
    if(!file||!file.type||!file.type.startsWith('image/')){toast('please choose an image');return null;}
    if(file.size>16777216){toast('choose an image smaller than 16 MB');return null;}
    return await fileToData(file);
  };
  const chooseFile=()=>new Promise(resolve=>{
    const input=document.createElement('input');input.type='file';input.accept='image/*';
    input.onchange=()=>resolve(input.files&&input.files[0]||null);input.click();
  });
  const closeActionMenu=()=>document.querySelector('.photo-action-overlay')?.remove();
  const pastePrompt=target=>{pendingPaste=target;closeActionMenu();toast('copy an image, then press Ctrl + V to paste it');};
  const showActionMenu=(title,actions)=>{
    closeActionMenu();
    const overlay=document.createElement('div');overlay.className='photo-action-overlay';
    const panel=document.createElement('div');panel.className='photo-action-popover';
    const heading=document.createElement('div');heading.className='photo-action-heading';heading.textContent=title;
    const list=document.createElement('div');list.className='photo-action-list';
    actions.forEach(action=>{
      const button=document.createElement('button');button.type='button';button.className='photo-action-option'+(action.danger?' danger':'');
      const icon=document.createElement('span');icon.className='photo-action-icon';icon.textContent=action.icon||'';
      const label=document.createElement('span');label.textContent=action.label;
      button.append(icon,label);button.addEventListener('click',()=>{closeActionMenu();action.run();});list.append(button);
    });
    panel.append(heading,list);overlay.append(panel);document.body.append(overlay);
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeActionMenu();});
    const esc=e=>{if(e.key==='Escape'){closeActionMenu();document.removeEventListener('keydown',esc);}};
    document.addEventListener('keydown',esc);
  };
  const photoCrop=i=>cropEditor(db.photos[i],db.photoCrops?.[i]||{},crop=>{db.photoCrops??=[];db.photoCrops[i]=crop;persist();renderPhotos();});
  const addFromFile=async()=>{
    if(db.photos.length>=6){toast('the camera grid is full (6/6). remove or replace a photo first.');return;}
    const file=await chooseFile();if(!file)return;const data=await imageFile(file);if(!data)return;
    db.photos.push(data);db.photoPositions??=[];db.photoCrops??=[];db.photoPositions.push('center center');db.photoCrops.push({});if(persist()){renderPhotos();toast('photo added to the grid');}
  };
  managePhoto=function(i){
    if(i<0||i>=db.photos.length)return;
    const actions=[
      {label:'Replace',icon:'↻',run:async()=>{const file=await chooseFile();if(!file)return;const data=await imageFile(file);if(!data)return;db.photos[i]=data;db.photoCrops??=[];db.photoCrops[i]={};if(persist()){renderPhotos();photoCrop(i);toast('photo replaced');}}},
      {label:'Remove',icon:'×',danger:true,run:()=>{db.photos.splice(i,1);db.photoPositions?.splice(i,1);db.photoCrops?.splice(i,1);if(persist()){renderPhotos();toast('photo removed');}}},
      {label:'Change grid',icon:'▧',run:()=>photoCrop(i)},
      {label:'Add',icon:'＋',run:()=>{if(db.photos.length>=6){toast('the camera grid is full (6/6). remove or replace a photo first.');return;}addFromFile();}},
      {label:'Copy / paste image',icon:'▣',run:()=>pastePrompt({type:'photo',index:i})}
    ];
    showActionMenu('photo '+(i+1),actions);
  };
  addPhoto=function(){
    if(db.photos.length>=6){toast('the camera grid is full (6/6). remove or replace a photo first.');return;}
    showActionMenu('add a photo',[
      {label:'Choose image',icon:'＋',run:addFromFile},
      {label:'Copy / paste image',icon:'▣',run:()=>pastePrompt({type:'newPhoto'})}
    ]);
  };
  const coverMenu=()=>showActionMenu('album cover',[
    {label:'Replace',icon:'↻',run:async()=>{const file=await chooseFile();if(!file)return;const data=await imageFile(file);if(!data)return;db.musicCover=data;db.musicCoverCrop={};$('#music-art').src=data;$('#music-art').hidden=false;persist();cropEditor(data,{},crop=>{db.musicCoverCrop=crop;cropStyle($('#music-art'),crop);persist();applyMusicColor();});}},
    {label:'Change grid',icon:'▧',run:()=>{if(!db.musicCover){toast('add an album cover first');return;}cropEditor(db.musicCover,db.musicCoverCrop||{},crop=>{db.musicCoverCrop=crop;cropStyle($('#music-art'),crop);persist();applyMusicColor();});}},
    {label:'Copy / paste image',icon:'▣',run:()=>pastePrompt({type:'cover'})}
  ]);
  const coverButton=$('#music-art-button');
  coverButton.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();coverMenu();},true);
  $('#music-art').addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();coverMenu();},true);
  document.addEventListener('paste',async e=>{
    if(!pendingPaste)return;
    const item=[...(e.clipboardData?.items||[])].find(x=>x.type&&x.type.startsWith('image/'));
    if(!item){toast('clipboard has no image. copy an image and try again.');return;}
    e.preventDefault();e.stopImmediatePropagation();const file=item.getAsFile();const data=await imageFile(file);if(!data)return;
    const target=pendingPaste;pendingPaste=null;
    if(target.type==='cover'){
      db.musicCover=data;db.musicCoverCrop={};$('#music-art').src=data;$('#music-art').hidden=false;
      cropEditor(data,{},crop=>{db.musicCoverCrop=crop;cropStyle($('#music-art'),crop);persist();applyMusicColor();toast('album cover pasted');});
    }else if(target.type==='photo'){
      db.photos[target.index]=data;db.photoCrops??=[];db.photoCrops[target.index]={};if(persist()){renderPhotos();photoCrop(target.index);toast('image pasted into photo slot');}
    }else if(target.type==='newPhoto'){
      if(db.photos.length>=6){toast('the camera grid is full (6/6). remove or replace a photo first.');return;}
      db.photos.push(data);db.photoPositions??=[];db.photoCrops??=[];db.photoPositions.push('center center');db.photoCrops.push({});if(persist()){renderPhotos();toast('image pasted into the camera grid');}
    }
  },true);
})();
</script>

<script id="v18-music-palette-final">
(()=>{
 const panel=document.querySelector('.music-panel'),art=document.querySelector('#music-art'),audio=document.querySelector('#audio-player'),vol=document.querySelector('#music-volume'),seek=document.querySelector('#music-seek');
 if(!panel||!art)return;
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const css=a=>`rgb(${a.map(v=>Math.round(clamp(v,0,255))).join(',')})`;
 function getDominant(){
  try{
   if(!art.hidden&&art.complete&&art.naturalWidth){
    const c=document.createElement('canvas');c.width=c.height=40;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(art,0,0,40,40);
    const data=ctx.getImageData(0,0,40,40).data,bins=new Map();
    for(let i=0;i<data.length;i+=4){if(data[i+3]<100)continue;const r=data[i],g=data[i+1],b=data[i+2];const key=[r>>5,g>>5,b>>5].join(':');let v=bins.get(key);if(!v)bins.set(key,v={n:0,r:0,g:0,b:0});v.n++;v.r+=r;v.g+=g;v.b+=b;}
    let best=null;for(const v of bins.values())if(!best||v.n>best.n)best=v;
    if(best)return [best.r/best.n,best.g/best.n,best.b/best.n];
   }
  }catch(e){}
  return null;
 }
 function updatePalette(){
  const dominant=getDominant();
  if(!dominant){
   // Before a cover is selected, match the music widget to the active theme's other widgets.
   panel.style.setProperty('--music-bg','var(--panel)');
   panel.style.setProperty('--music-control','var(--ink)');
   panel.style.setProperty('--music-text','var(--ink)');
   panel.style.setProperty('--music-track','var(--accent)');
   return;
  }
  const [r,g,b]=dominant,lum=.2126*r+.7152*g+.0722*b;
  // Keep the real dominant hue; only soften it enough for a usable widget surface.
  const bg=lum>165?[r*.34+255*.66,g*.34+255*.66,b*.34+255*.66]:[r*.58+255*.42,g*.58+255*.42,b*.58+255*.42];
  // Transport controls use a distinct darker/lighter shade derived from the cover.
  const fg=lum>150?[r*.42,g*.42,b*.42]:[r+(255-r)*.58,g+(255-g)*.58,b+(255-b)*.58];
  panel.style.setProperty('--music-bg',css(bg));panel.style.setProperty('--music-control',css(fg));
  panel.style.setProperty('--music-text',(.2126*bg[0]+.7152*bg[1]+.0722*bg[2])>160?'#242b31':'#fff');
  panel.style.setProperty('--music-track',css(fg));
 }
 function volumeFill(){if(!vol)return;const min=Number(vol.min||0),max=Number(vol.max||1),value=Number(vol.value||0),pct=clamp((value-min)/(max-min||1)*100,0,100);vol.style.setProperty('--volume-fill',pct+'%');}
 function sync(){if(audio){const play=document.querySelector('#play-btn');if(play){play.textContent=(audio.paused||audio.ended)?'Ⅱ':'▶';play.setAttribute('aria-label',(audio.paused||audio.ended)?'play':'pause');}}}
 if(vol){if(audio)audio.volume=Number(vol.value||.8);vol.addEventListener('input',()=>{if(audio)audio.volume=Number(vol.value);volumeFill()});vol.addEventListener('change',volumeFill);volumeFill();}
 if(seek&&audio){seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=Number(seek.value)/100*audio.duration});audio.addEventListener('timeupdate',()=>{if(audio.duration)seek.value=audio.currentTime/audio.duration*100});}
 if(audio){['play','pause','ended','loadedmetadata'].forEach(ev=>audio.addEventListener(ev,()=>{sync();updatePalette()}));}
 art.addEventListener('load',updatePalette);
 const coverInput=document.querySelector('#cover-file');if(coverInput)coverInput.addEventListener('change',()=>setTimeout(updatePalette,150));
 // Re-evaluate when a theme is changed, including returning to DDAY.
 document.querySelectorAll('.theme-option').forEach(btn=>btn.addEventListener('click',()=>setTimeout(updatePalette,0)));
 updatePalette();sync();
})();
</script>
